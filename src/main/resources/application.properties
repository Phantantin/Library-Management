spring.application.name=Library-Management

server.port=5000

# Load secret config locally
spring.config.import=optional:classpath:application-local.properties,optional:file:.env[.properties]

# Database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Razorpay
razorpay.callback.base-url=${FRONTEND_URL:http://localhost:3000}



app.jwt.secret=${JWT_SECRET:}
app.jwt.require-configured-secret=${JWT_REQUIRE_CONFIGURED_SECRET:false}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
app.payment.currency=${PAYMENT_CURRENCY:VND}
