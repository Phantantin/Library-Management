spring.application.name=Library-Management

server.port=${PORT:${SERVER_PORT:5000}}
server.forward-headers-strategy=framework
server.shutdown=graceful

# Load secret config locally
spring.config.import=optional:classpath:application-local.properties,optional:file:.env[.properties]

# Database
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Versioned schema migrations. Keep disabled for existing local databases unless
# they are baselined; production deployment enables these variables explicitly.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.jwt.secret=${JWT_SECRET:}
app.jwt.require-configured-secret=${JWT_REQUIRE_CONFIGURED_SECRET:false}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.payment.currency=${PAYMENT_CURRENCY:VND}
app.loan.max-active-loans=${LOAN_MAX_ACTIVE_LOANS:5}
app.loan.max-checkout-days=${LOAN_MAX_CHECKOUT_DAYS:30}
app.loan.max-renewal-days=${LOAN_MAX_RENEWAL_DAYS:14}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.backend-url=${BACKEND_PUBLIC_URL:http://localhost:5000}
